<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3eaf2">
  <title>Psicólogo Matheus</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e3eaf2;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbzlFoVbSdKcVB61R8ddoxBibKTGgkqQYbb5TrH5yruIZzuBvO2UfC9I5veXkLOr3h602g/exec" allow="geolocation; camera; microphone"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('PWA ativo'))
        .catch(err => console.error('Falha SW:', err));
    }
  </script>
</body>
</html>
